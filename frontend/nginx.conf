server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API отдаётся тем же origin, что и приложение: браузер не делает
    # кросс-доменный запрос, поэтому CORS в backend не нужен.
    # URI-часть в proxy_pass не указана — путь запроса сохраняется как есть.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Приложение одностраничное: неизвестный путь открывает index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
