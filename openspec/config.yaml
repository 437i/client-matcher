schema: spec-driven

context: |
  Проект: client-matcher — небольшое веб-приложение для ручного сопоставления ID клиента в CRM и ID клиента на сайте.
  Репозиторий содержит Go backend в backend/; Go module: github.com/437i/client-matcher/backend; версия Go из go.mod — 1.26.1.
  Backend построен на Gin и использует Ports & Adapters: Domain, Application (ports/services), inbound HTTP и outbound adapters.
  Текущий тестовый источник CRM и сайта — CSV; целевые источники — CRM HTTP API и PostgreSQL сайта. Связи хранятся в отдельной PostgreSQL базе приложения.
  Фактическое поведение API определяется Gin router, handlers, HTTP DTO, response mapping и тестами, а не устаревшими описаниями.
  CSV проекта и fixtures синтетические и допустимы. Не добавляй реальные клиентские данные; не читай .env и секреты.
  Проект должен оставаться небольшим: избегай избыточных абстракций, микросервисов и несвязанных рефакторингов.
  Frontend лежит в frontend/ (React + TypeScript + Vite): это слой представления поверх того же API, без собственных бизнес-правил.
  Типы клиента генерируются из backend/openapi/swagger.yaml командой npm run api:types; серверное состояние — TanStack Query.
  Интерфейс предназначен для сотрудников фонда с небольшим опытом работы с компьютером: правила rules/non-technical-ux.md обязательны.
  Контроль доступа не реализован: версия предназначена для доверенного локального или изолированного окружения.
  Пользователь предпочитает инструкции и отчёты на русском языке.

rules:
  proposal:
    - Описывай минимальный объём первой версии и явно отмечай, что оставлено за
      рамками.
    - До предложения изменений изучай фактические маршруты, DTO, services,
      ports, adapters и существующие тесты.
    - Не включай несвязанный рефакторинг и изменение API-контрактов без прямого
      требования.
  design:
    - Сохраняй направление зависимостей Ports & Adapters; Domain не зависит от
      Gin, PostgreSQL или CSV.
    - Для API-документации описывай фактический контракт, не подгоняй исходный
      код под генератор.
    - Для изменений внешних источников сохраняй Application ports и меняй только
      необходимые adapters и wiring.
  tasks:
    - Для каждой задачи указывай конкретные файлы/пакеты и проверяемый результат.
    - Включай тесты и команды проверки; не отмечай тест выполненным без
      фактического запуска.
    - Используй синтетические fixtures; не публикуй секреты и реальные клиентские данные.

operations:
  apply:
    guidance:
      - Перед изменениями проверь git status и не затрагивай пользовательский
        diff.
      - Реализуй только задачи текущего change; не расширяй scope самовольно.
      - Не меняй миграции, исходные данные и HTTP-контракт, если change прямо
        этого не требует.
      - После реализации выполни доступные проверки и укажи ограничения
        окружения.
  archive:
    guidance:
      - Архивируй change только после проверки реализации и подтверждения
        отсутствия незавершённых задач.
      - Не удаляй исходные спецификации и историю изменений.
skillsScope: project
